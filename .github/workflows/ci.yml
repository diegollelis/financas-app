# Integração contínua: roda a cada push na main e em todo pull request.
# Executa os mesmos comandos usados localmente (ADR 0013).
name: CI

on:
  push:
    branches: [main]
  pull_request:

# Menor privilégio: o workflow só lê o repositório.
permissions:
  contents: read

# Um push novo no mesmo branch cancela a execução anterior, que ficou obsoleta.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Lint, typecheck, testes e build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Actions fixadas por SHA (o comentário indica a versão). O Dependabot as atualiza.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Instala a versão do pnpm declarada em "packageManager" no package.json.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          cache: true

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc

      # --frozen-lockfile: falha se o pnpm-lock.yaml não corresponder aos package.json.
      # O postinstall da API gera o client do Prisma.
      - run: pnpm install --frozen-lockfile

      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
