# Integração contínua: roda a cada push na main e em todo pull request.
# Executa os mesmos comandos usados localmente (ADR 0013).
name: CI

on:
  push:
    branches: [main]
  pull_request:

# Menor privilégio: o workflow só lê o repositório.
permissions:
  contents: read

# Um push novo no mesmo branch cancela a execução anterior, que ficou obsoleta.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Repositório público: procura credenciais em todo o histórico a cada execução (ADR 0019).
  secrets:
    name: Varredura de segredos
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Histórico completo: um segredo apagado num commit posterior continua no histórico.
          fetch-depth: 0

      # Imagem fixada pelo digest (equivale a fixar a action por SHA).
      - name: gitleaks (v8.30.1)
        run: >-
          docker run --rm -v "$PWD:/repo"
          zricethezav/gitleaks@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
          git /repo --redact --no-banner -v

  ci:
    name: Lint, typecheck, testes e build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Postgres de verdade para os testes HTTP da API (ADR 0020). Mesmas credenciais e porta do
    # docker-compose.yml local; o globalSetup dos testes cria o banco financas_test e aplica as migrações.
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: financas
          POSTGRES_PASSWORD: financas
          POSTGRES_DB: financas
        ports:
          - 5434:5432
        options: >-
          --health-cmd "pg_isready -U financas -d financas"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      # Actions fixadas por SHA (o comentário indica a versão). O Dependabot as atualiza.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Instala a versão do pnpm declarada em "packageManager" no package.json.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          cache: true

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc

      # --frozen-lockfile: falha se o pnpm-lock.yaml não corresponder aos package.json.
      # O postinstall da API gera o client do Prisma.
      - run: pnpm install --frozen-lockfile

      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
