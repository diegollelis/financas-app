# Banco local de desenvolvimento (ADR 0005). Em produção usamos o Neon.
# As credenciais abaixo valem só para a máquina local.
services:
  postgres:
    image: postgres:18-alpine
    container_name: financas-postgres
    environment:
      POSTGRES_USER: financas
      POSTGRES_PASSWORD: financas
      POSTGRES_DB: financas
    ports:
      # 5432 e 5433 já são usadas por bancos de outros projetos nesta máquina.
      # 127.0.0.1: só esta máquina acessa. Sem isso, qualquer um na mesma rede conectaria
      # com a senha acima, que é pública no repositório.
      - '127.0.0.1:5434:5432'
    volumes:
      # A partir do Postgres 18 a imagem guarda os dados em /var/lib/postgresql/<versão>.
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U financas -d financas']
      interval: 5s
      timeout: 3s
      retries: 10

  # Carteiro falso para desenvolvimento (ADR 0022): recebe os e-mails que a API envia e os mostra
  # em uma caixa de entrada web em http://localhost:8025. Nada sai desta máquina.
  mailpit:
    image: axllent/mailpit:v1.31.3
    container_name: financas-mailpit
    ports:
      - '127.0.0.1:8025:8025'

volumes:
  postgres-data:
