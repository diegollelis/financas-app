# Abre PRs semanais com atualizações. Cada PR passa pelo CI antes de ser aceito.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # Agrupa as atualizações menores para não gerar um PR por pacote.
    groups:
      minor-and-patch:
        update-types: [minor, patch]
